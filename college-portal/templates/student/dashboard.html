<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
        }

        .navbar{
            background:linear-gradient(90deg,#1f3cff,#6b2cff);
        }

        .card-box{
            border:none;
            border-radius:18px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            transition:.3s;
            text-decoration:none;
            color:black;
            cursor:pointer;
            display:block;
            height:100%;
        }

        .card-box:hover{
            transform:translateY(-5px);
        }

        .icon{
            width:70px;
            height:70px;
            border-radius:18px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            color:white;
            margin:auto;
            margin-top:20px;
            margin-bottom:20px;
        }

        .blue{background:#4d7cff;}
        .green{background:#25c9a6;}
        .pink{background:#f05ac9;}
        .orange{background:#ffb347;}
        .purple{background:#8b5cf6;}
        .red{background:#ff5d73;}
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid px-4">
        <h3 class="text-white">
            <i class="bi bi-mortarboard-fill"></i>
            Student Dashboard
        </h3>

        <a href="/logout" class="btn btn-outline-light">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h1>Welcome, {{ student.name }} 👋</h1>
    <p class="text-muted">
        College Management & Student Information Portal
    </p>

    <div class="row mt-4 g-4">

        <!-- Profile -->
        <div class="col-md-6 col-lg-4">
            <a href="/profile" class="card card-box p-4">
                <div class="icon blue">
                    <i class="bi bi-person-circle"></i>
                </div>

                <h4 class="text-center">My Profile</h4>
                <p class="text-center text-muted">
                    View & Edit Profile
                </p>
            </a>
        </div>

        <!-- Notices -->
        <div class="col-md-6 col-lg-4">
            <a href="{{ url_for('student_notices') }}" class="card card-box p-4">
                <div class="icon green">
                    <i class="bi bi-megaphone-fill"></i>
                </div>

                <h4 class="text-center">Notices</h4>
                <p class="text-center text-muted">
                    View Latest Notices
                </p>
            </a>
        </div>

        <!-- Events -->
        <div class="col-md-6 col-lg-4">
            <a href="{{ url_for('student_events') }}" class="card card-box p-4">
                <div class="icon orange">
                    <i class="bi bi-calendar-event-fill"></i>
                </div>

                <h4 class="text-center">Events</h4>
                <p class="text-center text-muted">
                    Upcoming College Events
                </p>
            </a>
        </div>

        <!-- Study Materials -->
        <div class="col-md-6 col-lg-4">
            <a href="/student_materials" class="card card-box p-4">
                <div class="icon pink">
                    <i class="bi bi-book-fill"></i>
                </div>

                <h4 class="text-center">Study Materials</h4>
                <p class="text-center text-muted">
                    Access Notes & Resources
                </p>
            </a>
        </div>

        <!-- Results -->
        <div class="col-md-6 col-lg-4">
            <a href="/student_results" class="card card-box p-4">
                <div class="icon purple">
                    <i class="bi bi-file-earmark-text-fill"></i>
                </div>

                <h4 class="text-center">Results</h4>
                <p class="text-center text-muted">
                    View Results & Download Marksheet
                </p>
            </a>
        </div>

    </div>

</div>

</body>
</html>
