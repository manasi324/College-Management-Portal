<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Edit Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6fb;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .card-header{
            border-radius:18px 18px 0 0 !important;
        }

        input[readonly]{
            background:#eef2ff;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-primary text-white">

<h3>Edit Student Result</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="row mb-4">

<div class="col-md-6">

<label class="fw-bold">Student</label>

<input
type="text"
class="form-control"
value="{{ result.student.name }}"
readonly>

</div>

<div class="col-md-6">

<label class="fw-bold">Subject</label>

<input
type="text"
class="form-control"
value="{{ result.subject.subject_name }}"
readonly>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-3">

<label>Internal (20)</label>

<input
type="number"
class="form-control mark"
name="internal"
min="0"
max="20"
value="{{ result.internal }}"
required>

</div>

<div class="col-md-3">

<label>Assignment (20)</label>

<input
type="number"
class="form-control mark"
name="assignment"
min="0"
max="20"
value="{{ result.assignment }}"
required>

</div>

<div class="col-md-3">

<label>External (30)</label>

<input
type="number"
class="form-control mark"
name="external"
min="0"
max="30"
value="{{ result.external }}"
required>

</div>

<div class="col-md-3">

<label>Practical (30)</label>

<input
type="number"
class="form-control mark"
name="practical"
min="0"
max="30"
value="{{ result.practical }}"
required>

</div>

</div>

<hr>

<div class="row">

<div class="col-md-4">

<label>Total</label>

<input
type="number"
id="total"
class="form-control"
value="{{ result.total }}"
readonly>

</div>

<div class="col-md-4">

<label>Grade</label>

<input
type="text"
id="grade"
class="form-control"
value="{{ result.grade }}"
readonly>

</div>

<div class="col-md-4">

<label>Status</label>

<input
type="text"
id="status"
class="form-control"
value="{{ result.status }}"
readonly>

</div>

</div>

<div class="text-center mt-4">

<button class="btn btn-success px-5">

Update Result

</button>

<a
href="/view_results"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

<script>

function calculate(){

    let internal=parseInt(document.querySelector("[name='internal']").value)||0;

    let assignment=parseInt(document.querySelector("[name='assignment']").value)||0;

    let external=parseInt(document.querySelector("[name='external']").value)||0;

    let practical=parseInt(document.querySelector("[name='practical']").value)||0;

    let total=internal+assignment+external+practical;

    document.getElementById("total").value=total;

    let grade="";
    let status="";

    if(total>=90){
        grade="A+";
        status="PASS";
    }

    else if(total>=80){
        grade="A";
        status="PASS";
    }

    else if(total>=70){
        grade="B+";
        status="PASS";
    }

    else if(total>=60){
        grade="B";
        status="PASS";
    }

    else if(total>=50){
        grade="C";
        status="PASS";
    }

    else if(total>=40){
        grade="D";
        status="PASS";
    }

    else{
        grade="F";
        status="FAIL";
    }

    document.getElementById("grade").value=grade;

    document.getElementById("status").value=status;

}

document.querySelectorAll(".mark").forEach(box=>{

    box.addEventListener("input",calculate);

});

</script>

</body>

</html>
