<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6fb;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .btn-save{
            background:#2b5cff;
            color:white;
        }

        .btn-save:hover{
            background:#1b45d4;
            color:white;
        }

        h5{
            font-weight:600;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">Student Result Entry</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- Semester -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Semester</label>

                        <select class="form-select" name="semester" required>

                            <option value="">Select Semester</option>

                            <option>Semester 1</option>
                            <option>Semester 2</option>
                            <option>Semester 3</option>
                            <option>Semester 4</option>
                            <option>Semester 5</option>
                            <option>Semester 6</option>

                        </select>

                    </div>

                    <!-- Exam Type -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Exam Type</label>

                        <select
                            class="form-select"
                            id="examType"
                            name="exam_type"
                            required>

                            <option value="">Select Exam Type</option>
                            <option value="Internal">Internal</option>
                            <option value="External">External</option>
                            {% if marks_scheme.practical > 0 %}
                            <option value="Practical">Practical</option>
                            {% endif %}
                            <option value="Assignment">{{ marks_scheme.others_label }} (PPT / Attendance)</option>

                        </select>

                    </div>

                    <!-- Exam Name -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Exam Name</label>

                        <input
                            type="text"
                            class="form-control"
                            name="exam_name"
                            placeholder="UT-1 / Semester End"
                            required>

                    </div>

                    <!-- Student -->

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Student</label>

                        <select class="form-select" name="student_id" required>

                            <option value="">Select Student</option>

                            {% for student in students %}

                            <option value="{{ student.id }}">
                                {{ student.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="text-center mb-4">

                    <button
                        type="button"
                        id="loadSubjects"
                        class="btn btn-primary">

                        Load Subjects

                    </button>

                </div>

                <hr>

                <h5>Subject Wise Marks</h5>

                <table class="table table-bordered">

                    <thead class="table-light">

                        <tr>

                            <th>Subject</th>
                            <th width="200">Marks Obtained</th>
                            <th width="200">Total Marks</th>

                        </tr>

                    </thead>

                    <tbody id="subjectsTable">

                    </tbody>

                </table>

                <div class="text-center">

                    <button type="submit" class="btn btn-save px-5">

                        Save Result

                    </button>

                </div>

            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }} mt-3">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}
            {% endwith %}

        </div>

    </div>

</div>

<script>

function getTotalMarks(examType) {

    switch (examType) {

        case "Internal":
            return {{ marks_scheme.internal }};

        case "External":
            return {{ marks_scheme.external }};

        case "Practical":
            return {{ marks_scheme.practical }};

        case "Assignment":
            return {{ marks_scheme.assignment }};

        default:
            return 0;

    }

}

document.getElementById("loadSubjects").addEventListener("click", function(){

    let semester = document.querySelector("[name='semester']").value;
    let examType = document.getElementById("examType").value;

    if(semester==""){

        alert("Please select Semester.");
        return;

    }

    if(examType==""){

        alert("Please select Exam Type.");
        return;

    }

    semester = semester.replace("Semester ","");

    fetch("/get_subjects/" + semester)

    .then(response => response.json())

    .then(data=>{

        let tbody = document.getElementById("subjectsTable");

        tbody.innerHTML="";

        let total = getTotalMarks(examType);

        data.forEach(subject=>{

            tbody.innerHTML += `

            <tr>

                <td>

                    ${subject.name}

                    <input
                        type="hidden"
                        name="subject[]"
                        value="${subject.name}">

                </td>

                <td>

                    <input
                        type="number"
                        class="form-control marksInput"
                        name="marks[]"
                        min="0"
                        max="${total}"
                        required>

                </td>

                <td>

                    <input
                        type="number"
                        class="form-control totalMarks"
                        name="total[]"
                        value="${total}"
                        readonly>

                </td>

            </tr>

            `;

        });

    });

});

document.getElementById("examType").addEventListener("change", function(){

    let total = getTotalMarks(this.value);

    document.querySelectorAll(".totalMarks").forEach(function(box){

        box.value = total;

    });

    document.querySelectorAll(".marksInput").forEach(function(box){

        box.max = total;

        if(box.value > total){

            box.value = "";

        }

    });

});

</script>

</body>
</html>
