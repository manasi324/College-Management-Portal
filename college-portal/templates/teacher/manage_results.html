<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6fb;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .btn-save{
            background:#2b5cff;
            color:white;
        }

        .btn-save:hover{
            background:#1b45d4;
            color:white;
        }

    </style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-primary text-white">

<h3>Student Result Entry</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-3 mb-3">

<label>Semester</label>

<select class="form-select" name="semester" required>

<option value="">Select</option>

<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label>Exam Type</label>

<select
    class="form-select"
    id="examType"
    name="exam_type"
    required>

    <option value="">Select</option>
    <option value="Internal">Internal</option>
    <option value="External">External</option>
    <option value="Practical">Practical</option>
    <option value="Assignment">Assignment / Journal / Attendance</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label>Exam Name</label>

<input
type="text"
class="form-control"
name="exam_name"
placeholder="UT-1 / UT-2 / Semester End"
required>

</div>

<div class="col-md-3 mb-3">

<label>Student</label>

<select class="form-select" name="student_id" required>

<option value="">Select Student</option>

{% for student in students %}

<option value="{{ student.id }}">
{{ student.name }}
</option>

{% endfor %}

</select>

</div>

</div>

<hr>

<h5>Subject Wise Marks</h5>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>Subject</th>
            <th>Marks Obtained</th>
            <th>Total Marks</th>
        </tr>
    </thead>

    <tbody id="subjectsTable">
    </tbody>

</table>

<div class="text-center">

<button class="btn btn-save px-5">

Save Result

</button>

</div>
<div class="text-center mt-3">

    <button
        type="button"
        id="loadSubjects"
        class="btn btn-primary">

        Load Subjects

    </button>

</div>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}
{% endwith %}
</form>

</div>

</div>

</div>

<script>

document.getElementById("loadSubjects").onclick = function () {

    let semester = document.querySelector("[name='semester']").value;
    let examType = document.getElementById("examType").value;

    if (semester == "") {
        alert("Select Semester First");
        return;
    }

    semester = semester.replace("Semester ", "");

    fetch("/get_subjects/" + semester)

    .then(response => response.json())

    .then(data => {

        let table = document.getElementById("subjectsTable");

        table.innerHTML = "";

        // Decide total marks
        let total = 0;

        if (examType === "Internal")
            total = 20;

        else if (examType == "External")
            total = 30;

        else if (examType == "Practical")
            total = 30;

else if (examType == "Assignment")
            total = 20;

        data.forEach(subject => {

            table.innerHTML += `

            <tr>

                <td>

                    <input
                        type="hidden"
                        name="subject[]"
                        value="${subject.name}">

                    ${subject.name}

                </td>

                <td>

                    <input
                        type="number"
                        class="form-control"
                        name="marks[]"
                        min="0"
                        max="${total}"
                        required>

                </td>

                <td>

                    <input
                        type="number"
                        class="form-control totalMarks"
                        name="total[]"
                        value="${total}"
                        readonly>

                </td>

            </tr>

            `;

        });

    });

};


// Change Total Marks when Exam Type changes
document.getElementById("examType").addEventListener("change", function () {

    let total = 0;

    if (this.value == "Internal")
        total = 20;

    else if (this.value == "External")
        total = 30;

    else if (this.value == "Practical")
        total = 30;

else if (this.value == "Assignment")
        total = 20;

    // Update the displayed Total Marks column
    document.querySelectorAll(".totalMarks").forEach(function(box){
        box.value = total;
    });

    // Also update the max limit on the marks input fields
    document.querySelectorAll("[name='marks[]']").forEach(function(box){
        box.max = total;
    });

});

</script>
</body>
</html>
