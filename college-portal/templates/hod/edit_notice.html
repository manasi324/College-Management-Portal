<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Department Notice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Edit Department Notice</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Notice Title</label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ notice.title }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea
                    name="description"
                    rows="5"
                    class="form-control"
                    required>{{ notice.description }}</textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Update Notice
            </button>

            {% if session.get("role") == "Teacher" %}
                <a href="{{ url_for('teacher_notices') }}" class="btn btn-secondary">
                    Cancel
                </a>
            {% else %}
                <a href="{{ url_for('department_notices') }}" class="btn btn-secondary">
                    Cancel
                </a>
            {% endif %}

        </form>

    </div>

</div>

</body>
</html>
